<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 190" role="img" aria-labelledby="title desc"><title id="title">Union Alpha evidence taxonomy</title><desc id="desc">Four evidence classes move from official facts to unresolved questions without becoming proof of quality or identity.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#73e3ff"/><stop offset="1" stop-color="#a998ff"/></linearGradient></defs><rect width="920" height="190" rx="18" fill="#101a31"/><path d="M112 94H808" stroke="url(#g)" stroke-width="4"/><g font-family="system-ui,sans-serif"><g><circle cx="112" cy="94" r="25" fill="#173f4e" stroke="#73e3ff" stroke-width="3"/><text x="112" y="100" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">1</text><text x="112" y="142" text-anchor="middle" fill="#eef4ff" font-size="16" font-weight="700">Known</text><text x="112" y="165" text-anchor="middle" fill="#aab6d4" font-size="12">official route facts</text></g><g><circle cx="344" cy="94" r="25" fill="#2d254f" stroke="#a998ff" stroke-width="3"/><text x="344" y="100" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">2</text><text x="344" y="142" text-anchor="middle" fill="#eef4ff" font-size="16" font-weight="700">Tested</text><text x="344" y="165" text-anchor="middle" fill="#aab6d4" font-size="12">reproducible outcome only</text></g><g><circle cx="576" cy="94" r="25" fill="#4b3d1d" stroke="#ffd36e" stroke-width="3"/><text x="576" y="100" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">3</text><text x="576" y="142" text-anchor="middle" fill="#eef4ff" font-size="16" font-weight="700">Reported</text><text x="576" y="165" text-anchor="middle" fill="#aab6d4" font-size="12">attributed experience</text></g><g><circle cx="808" cy="94" r="25" fill="#48242b" stroke="#ff9d9d" stroke-width="3"/><text x="808" y="100" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">4</text><text x="808" y="142" text-anchor="middle" fill="#eef4ff" font-size="16" font-weight="700">Unknown</text><text x="808" y="165" text-anchor="middle" fill="#aab6d4" font-size="12">not filled with guesses</text></g><text x="460" y="32" text-anchor="middle" fill="#dce7ff" font-size="15" font-weight="700">A claim keeps its class — it does not rise just because it is repeated.</text></g></svg>
