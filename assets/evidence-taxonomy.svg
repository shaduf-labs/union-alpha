<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 190" role="img" aria-labelledby="title desc"><title id="title">Union Alpha evidence taxonomy</title><desc id="desc">Four classes distinguish documented status, direct observation, attributed report and remaining unknown.</desc><rect width="920" height="190" rx="14" fill="#f6f7f8"/><path d="M112 92H808" stroke="#b7c4d7" stroke-width="3"/><g font-family="system-ui,sans-serif"><text x="460" y="31" text-anchor="middle" fill="#3e4652" font-size="15" font-weight="700">A claim keeps its class — repetition does not turn it into proof.</text><g><circle cx="112" cy="92" r="24" fill="#e4f3ea" stroke="#25734d" stroke-width="2"/><text x="112" y="98" text-anchor="middle" fill="#25734d" font-size="18" font-weight="700">1</text><text x="112" y="140" text-anchor="middle" fill="#23262d" font-size="16" font-weight="700">Documented</text><text x="112" y="163" text-anchor="middle" fill="#616874" font-size="12">official route facts</text></g><g><circle cx="344" cy="92" r="24" fill="#edeafa" stroke="#6552a8" stroke-width="2"/><text x="344" y="98" text-anchor="middle" fill="#6552a8" font-size="18" font-weight="700">2</text><text x="344" y="140" text-anchor="middle" fill="#23262d" font-size="16" font-weight="700">Observed</text><text x="344" y="163" text-anchor="middle" fill="#616874" font-size="12">recorded direct result</text></g><g><circle cx="576" cy="92" r="24" fill="#fff3d6" stroke="#9a6200" stroke-width="2"/><text x="576" y="98" text-anchor="middle" fill="#9a6200" font-size="18" font-weight="700">3</text><text x="576" y="140" text-anchor="middle" fill="#23262d" font-size="16" font-weight="700">Reported</text><text x="576" y="163" text-anchor="middle" fill="#616874" font-size="12">attributed experience</text></g><g><circle cx="808" cy="92" r="24" fill="#fbeaea" stroke="#9c3c39" stroke-width="2"/><text x="808" y="98" text-anchor="middle" fill="#9c3c39" font-size="18" font-weight="700">4</text><text x="808" y="140" text-anchor="middle" fill="#23262d" font-size="16" font-weight="700">Unknown</text><text x="808" y="163" text-anchor="middle" fill="#616874" font-size="12">not filled with guesses</text></g></g></svg>
